name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (standard library only)
        run: python -m unittest discover tests -v
      - name: JavaScript syntax
        run: for f in docs/assets/*.js; do node --check "$f"; done
