<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — UMA</title>
  <link rel="stylesheet" href="./assets/uma.css">
  <script>
    // Short routes on GitHub Pages: /UMA/study/PRJNA271013 -> study.html?acc=PRJNA271013, and
    // /finding/C1, /sample/…, /run/…, /place/<GeoNames id>, /country/US.
    (function(){
      var base = location.pathname.indexOf("/UMA/") === 0 ? "/UMA/" : "/";
      var parts = location.pathname.slice(base.length).split("/").filter(Boolean);
      var map = { study: "study.html?acc=", sample: "sample.html?acc=", run: "run.html?acc=", place: "place.html?id=",
                  country: "place.html?country=", finding: "findings.html?id=" };
      if (parts.length === 2 && map[parts[0]]) location.replace(base + map[parts[0]] + encodeURIComponent(parts[1]));
    })();
  </script>
</head>
<body>
<main class="wrap" style="padding:40px 20px"><h1>Page not found</h1><p><a href="./index.html">Go to the overview</a> or <a href="./search.html">search the release</a>.</p></main>
</body>
</html>
